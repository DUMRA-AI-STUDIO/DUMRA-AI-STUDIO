
<!DOCTYPE html>
<html lang="en">
<!-- DUMRA AI STUDIO APP SETTINGS -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080808">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DUMRA AI"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUMRA AI STUDIO</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090909;color:#fff;
 font-family:Arial,sans-serif;padding:20px;
}
header{text-align:center;padding:25px 5px}
h1{color:#d6ad55;font-size:30px;letter-spacing:2px}
header p{color:#aaa}
.card{
 background:#181818;border:1px solid #755b2e;
 border-radius:15px;padding:18px;margin:16px 0;
}
h2{color:#e5c477;font-size:19px}
label{display:block;margin:14px 0 8px;color:#ddd}
textarea,select,input{
 width:100%;padding:13px;border-radius:9px;
 border:1px solid #555;background:#252525;
 color:white;font-size:15px;
}
textarea{height:110px;resize:vertical}
button{
 width:100%;padding:15px;border:0;border-radius:9px;
 background:linear-gradient(90deg,#a87925,#f1d18a);
 color:#111;font-weight:bold;font-size:16px;
 margin-top:15px;
}
#preview{
 width:100%;max-height:260px;object-fit:contain;
 display:none;margin-top:15px;border-radius:10px;
}
.note{color:#aaa;font-size:13px;line-height:1.6}
footer{text-align:center;color:#888;margin:30px 0}
</style>
</head>
<body>
<header>
<h1>DUMRA AI STUDIO</h1>
<p>Your Creative AI Video Studio</p>
</header>

<div class="card">
<h2>🎬 Create Your Video</h2>

<label>Choose Your Image</label>
<input type="file" id="photo" accept="image/*">
<img id="preview" alt="Image preview">

<label>Write Your Video Prompt</label>
<textarea id="prompt" placeholder="Describe your video scene here..."></textarea>

<label>Video Duration</label>
<select id="duration">
<option>5 Seconds</option>
<option>10 Seconds</option>
<option>20 Seconds</option>
<option>30 Seconds</option>
</select>

<label>Video Format</label>
<select id="format">
<option>16:9 YouTube</option>
<option>9:16 Shorts / Reels</option>
<option>1:1 Square</option>
</select>

<button onclick="createVideo()">CREATE VIDEO</button>
<p id="message" class="note">
Your AI video engine is not connected yet.
</p>
</div>

<div class="card">
<h2>📁 My Video Studio</h2>
<p class="note">
Upload an image, write a prompt and prepare your video settings.
AI generation will become available after connecting a video engine.
</p>
</div>

<footer>
DUMRA AI STUDIO © 2026
</footer>

<script>
document.getElementById('photo').addEventListener('change',function(){
 const file=this.files[0];
 if(file){
  const preview=document.getElementById('preview');
  preview.src=URL.createObjectURL(file);
  preview.style.display='block';
 }
});

function createVideo(){
 document.getElementById('message').textContent=
 'Your settings are ready. AI video engine connection is still required.';
}
</script>
</body>
</html>
